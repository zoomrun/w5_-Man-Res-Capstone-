<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2800" viewBox="0 0 2400 2800">
  <rect width="2400" height="1600" fill="#f5f3ed"/>
  <style>
.title{font:700 52px Arial;fill:#17221f}.subtitle{font:400 22px Arial;fill:#63706b}.section{font:700 22px Arial;fill:#07504d;letter-spacing:1px}.label{font:700 19px Arial;fill:#17221f}.body{font:400 15px Arial;fill:#2c3834}.tech{font:600 14px 'Courier New';fill:#8a3b14}.hint{font:italic 13px Arial;fill:#5c6b65}.foot{font:700 17px Arial;fill:#63706b}
